[project]
name = "brazil-rv"
version = "0.1.0"
description = "Point-in-time Brazilian mid-frequency quantitative research"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.1",
    "polars>=1.42.1",
    "torch==2.13.0",
]

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
preprocessing = [
    "databento==0.81.0",
    "fastexcel>=0.17.2",
    "pyarrow>=25.0.0",
    "pypdf>=6.1.0",
]
dev = [
    { include-group = "preprocessing" },
    "pytest>=9.1.1",
    "ruff>=0.15.22",
]
kronos = [
    "einops==0.8.1",
    "huggingface-hub==0.33.1",
    "pandas==2.2.2",
    "safetensors==0.6.2",
    "tqdm==4.67.1",
]

[tool.uv]
default-groups = []

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
